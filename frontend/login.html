<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- supaya tampilan responsive di hp -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- warna tema browser -->
    <meta name="theme-color" content="#FFD966">

    <title>LaundryGo - Admin Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- font poppins biar tampilan lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- icon bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* variable warna supaya konsisten (jadi ga tulis ulang warna berkali2) */
        :root {
            --pastel-yellow-light: #FFF9E6;
            --pastel-yellow: #FFEEB3;
            --pastel-yellow-medium: #FFE599;
            --pastel-yellow-dark: #FFD966;
            --text-primary: #5A4A42;
            --text-secondary: #8B7355;
            --white-soft: #FFFDF9;
            --shadow-soft: 0 8px 32px rgba(90, 74, 66, 0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            /* background gradasi */
            background: linear-gradient(135deg, var(--pastel-yellow-light) 0%, var(--pastel-yellow) 50%, var(--pastel-yellow-medium) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* hiasan background */
        body::before, body::after {
            content: ''; position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 217, 102, 0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        body::before { width: 400px; height: 400px; top: -100px; right: -100px; }
        body::after { width: 300px; height: 300px; bottom: -50px; left: -50px; }

        /* navbar */
        .navbar {
            padding: 1rem 0;
            position: relative;
            z-index: 10;
            /* efek blur */
            background: rgba(255, 253, 249, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 233, 153, 0.4);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-primary) !important;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .navbar-brand i { font-size: 1.4rem; color: var(--pastel-yellow-dark); }

        /* tombol kembali */
        .btn-back {
            background: var(--white-soft);
            color: var(--text-primary);
            border: 2px solid var(--pastel-yellow-dark);
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }

        .btn-back:hover {
            background: var(--pastel-yellow-dark);
            transform: translateY(-2px); /* efek naik pas hover */
        }

        /* main content */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        /* card login */
        .login-card {
            background: rgba(255, 253, 249, 0.9);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 233, 153, 0.6);
            animation: slideUp 0.6s ease-out; /* animasi muncul */
        }

        /* animasi muncul dari bawah */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 2rem; }

        /* icon atas */
        .login-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--pastel-yellow), var(--pastel-yellow-dark));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
        }

        .login-icon i { font-size: 1.8rem; color: var(--text-primary); }

/* input form */
.login-form {
    width: 100%;
}

.form-field {
    margin-bottom: 1.15rem;
}

.form-label {
    display: block;
    margin-bottom: 0.45rem;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-primary);
}

.input-wrapper {
    position: relative;
    width: 100%;
}

.input-wrapper i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 1rem;
    z-index: 2;
    pointer-events: none;
}

.login-input {
    width: 100%;
    height: 54px;
    border: 1.5px solid var(--pastel-yellow-medium);
    border-radius: var(--radius-md);
    background: var(--pastel-yellow-light);
    padding: 0 1rem 0 2.8rem;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
    transition: var(--transition);
}

.login-input:focus {
    border-color: var(--pastel-yellow-dark);
    background: var(--white-soft);
    box-shadow: 0 0 0 4px rgba(255, 217, 102, 0.22);
}

.form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin: 0.25rem 0 1.5rem;
}

.remember-option {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.9rem;
    cursor: pointer;
}

.remember-option input {
    width: 16px;
    height: 16px;
    accent-color: var(--pastel-yellow-dark);
}

.forgot-link {
    color: var(--text-primary);
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

.btn-login {
    background: linear-gradient(135deg, var(--pastel-yellow-dark), var(--pastel-yellow-medium));
    border: none;
    border-radius: 50px;
    padding: 1rem;
    width: 100%;
    cursor: pointer;
    color: var(--text-primary);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: var(--transition);
    box-shadow: 0 8px 20px rgba(255, 217, 102, 0.35);
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(255, 217, 102, 0.45);
}

.btn-login i {
    font-size: 1rem;
}
    </style>
</head>

<body>

    <!-- navbar -->
    <nav class="navbar">
        <div class="container">

            <!-- logo + nama web, supaya user tau lagi di halaman apa -->
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-basket2-fill"></i><span>LaundryGo</span>
            </a>

            <!-- tombol kembali ke halaman utama -->
            <a href="index.html" class="btn-back">
                <i class="bi bi-arrow-left"></i><span>Kembali</span>
            </a>
        </div>
    </nav>

    <!-- main -->
    <main class="main-content">
        <div class="container">
            <div class="login-card">
                
                <!-- header login -->
                <div class="login-header">
                    <div class="login-icon"><i class="bi bi-shield-lock"></i></div>
                    <h1>Admin Login</h1>
                    <p>Masuk untuk mengelola sistem LaundryGo</p>
                </div>

                <!-- 🔧 PERUBAHAN 1: Tambah id="loginForm" dan hapus action/method -->
               <form id="loginForm" class="login-form">

    <div class="form-field">
        <label class="form-label" for="email">Email Admin</label>
        <div class="input-wrapper">
            <i class="bi bi-envelope"></i>
            <input
                type="email"
                id="email"
                name="email"
                class="login-input"
                placeholder="admin@gmail.com"
                required
            >
        </div>
    </div>

    <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
            <i class="bi bi-lock"></i>
            <input
                type="password"
                id="password"
                name="password"
                class="login-input"
                placeholder="••••••••"
                required
                minlength="6"
            >
        </div>
    </div>

    <div class="form-options">
        <label class="remember-option">
            <input type="checkbox" id="remember" name="remember">
            <span>Ingat saya</span>
        </label>

        <a href="#" class="forgot-link">Lupa password?</a>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Masuk Sekarang</span>
    </button>

</form>

            </div>
        </div>
    </main>

    <!-- 🔧 PERUBAHAN 3: Script JavaScript untuk kirim data ke backend Express.js -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');

            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault(); // Mencegah halaman refresh

                    const email = emailInput.value.trim();
                    const password = passwordInput.value;

                    // Validasi sederhana
                    if (!email || !password) {
                        alert('Email dan password harus diisi!');
                        return;
                    }

                    // Ubah tombol jadi loading
                    const originalBtnText = loginBtn.innerHTML;
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses...';

                    try {
                        // Kirim data ke backend Express.js
                        const response = await fetch('http://localhost:3000/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        });

                        const result = await response.json();

                        if (result.success) {
                            // Simpan token di localStorage agar halaman lain tahu user sudah login
                            localStorage.setItem('adminToken', result.data.token);
                            localStorage.setItem('adminInfo', JSON.stringify(result.data.admin));
                            
                            alert('✅ ' + result.message);
                            
                            // Redirect ke dashboard
                            window.location.href = 'admindashboard.html';
                        } else {
                            alert('❌ ' + result.message);
                            // Kembalikan tombol seperti semula
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = originalBtnText;
                        }

                    } catch (error) {
                        console.error('Error:', error);
                        alert('❌ Gagal terhubung ke server. Pastikan backend Express.js sudah berjalan (npm run dev).');
                        // Kembalikan tombol seperti semula
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnText;
                    }
                });
            }
        });
    </script>
     <script src="assets/js/api.js"></script>

</body>
</html>
